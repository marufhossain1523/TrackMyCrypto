<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrackMyCrypto - Cryptocurrency Prices by Market Cap</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-page="market" class="bg-white text-ink antialiased" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
<header id="nav" class="border-b sticky top-0 bg-white z-20"></header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <h1 class="text-2xl font-bold">Today's Cryptocurrency Prices by Market Cap</h1>
  <p id="sub" class="text-sm text-slate-500 mt-1">Loading market data...</p>

  <div id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 my-5"></div>

  <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
    <div id="tabs" class="flex gap-1"></div>
    <input id="q" type="search" placeholder="Search coins" aria-label="Search coins" class="border rounded-lg px-3 py-2 text-sm w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-brand">
  </div>

  <div class="overflow-x-auto border rounded-xl">
    <table id="mk" class="w-full text-sm min-w-[1000px]"></table>
  </div>
</main>
<script src="shared.js"></script>
<script src="market.js"></script>
</body>
</html>
